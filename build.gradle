plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    maven { url "https://cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("curse.maven:l2library-620203:5275597")
    implementation fg.deobf("curse.maven:l2hostility-909207:6497957")
    implementation fg.deobf("curse.maven:curios-309927:4834490")
    implementation fg.deobf(files("libs/l2tabs-0.3.3.jar"))
    compileOnly files("libs/kubejs-forge-2001.6.5-build.26.jar")
    compileOnly files("libs/[犀牛] rhino-forge-2001.2.3-build.10.jar")
    compileOnly files("libs/architectury-9.2.14-forge.jar")
    compileOnly files("libs/l2damagetracker-0.4.3.jar")
    compileOnly files("libs/Registrate-MC1.20-1.3.11.jar")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-deprecation' << '-Xlint:-removal'
}

publishMods {
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "Initial release"
    type = BETA
    modLoaders.add("forge")

